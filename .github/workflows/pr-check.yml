name: Pull Request & CI Quality Bot

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📄 Setup Environment Config
        run: cp .env.example .env

      - name: 🔍 Lint Codebase (oxlint)
        run: npx oxlint

      - name: 🧪 Run Vitest Test Suite
        run: npx vitest run

      - name: 🏗️ Verify Production Build
        run: npm run build

